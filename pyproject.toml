[project]
name = "ultron"
version = "0.1.0"
description = "Claude plans and accepts; an executor via Antigravity CLI (agy) works. TaskSpec -> Executor -> TaskResult with a context firewall."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ultron = "ultron.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ultron*"]

[tool.setuptools.package-data]
ultron = ["schemas/*.json", "schemas/roles/*.json"]
